name: Release (macOS)

# Builds an unsigned MetaTV.app / .dmg on a version tag, or on demand via
# workflow_dispatch (test build → uploaded as a workflow artifact, no Release).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # needed to create/update a GitHub Release + upload assets

jobs:
  build:
    runs-on: macos-14  # Apple Silicon (arm64) runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install mpv + packaging tools (Homebrew)
        run: |
          brew update
          brew install mpv dylibbundler create-dmg

      - name: Resolve version and release metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)', pathlib.Path('metatv/__init__.py').read_text()).group(1))")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            # Strip a pre-release suffix (e.g. v0.10.0-rc1 -> v0.10.0) before the
            # equality guard against the source __version__.
            BASE_TAG="${TAG%%-*}"
            if [ "$BASE_TAG" != "v${VERSION}" ]; then
              echo "::error::Tag '$TAG' (base '$BASE_TAG') does not match v$VERSION from metatv/__init__.py"
              exit 1
            fi
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            if echo "$TAG" | grep -q -- '-rc'; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests (green gate)
        run: |
          pytest tests/ -q

      - name: Build MetaTV.app (PyInstaller)
        run: |
          pyinstaller packaging/metatv.spec --noconfirm

      - name: Vendor mpv into the app bundle
        run: |
          set -euo pipefail
          BREW_PREFIX="$(brew --prefix)"
          RES_DIR="dist/MetaTV.app/Contents/Resources/mpv"
          mkdir -p "$RES_DIR"
          cp "$BREW_PREFIX/bin/mpv" "$RES_DIR/mpv"
          # Gather + rewrite mpv's dylib dependencies into Resources/mpv/libs so
          # the bundle is self-contained (no Homebrew needed on the user's Mac).
          dylibbundler \
            -of -b \
            -x "$RES_DIR/mpv" \
            -d "$RES_DIR/libs" \
            -p "@loader_path/libs/" \
            -s "$BREW_PREFIX/lib"
          chmod +x "$RES_DIR/mpv"
          echo "Vendored mpv:"
          ls -la "$RES_DIR"

      - name: Create DMG
        id: dmg
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          DMG="MetaTV-${VERSION}-arm64.dmg"
          # create-dmg gives a nice drag-to-Applications window; fall back to a
          # plain hdiutil image if the styled build fails on the headless runner.
          create-dmg \
            --volname "MetaTV ${VERSION}" \
            --window-pos 200 120 \
            --window-size 600 380 \
            --icon-size 100 \
            --app-drop-link 430 180 \
            --no-internet-enable \
            "$DMG" \
            "dist/MetaTV.app" \
          || hdiutil create -volname "MetaTV ${VERSION}" \
               -srcfolder "dist/MetaTV.app" -ov -format UDZO "$DMG"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          ls -la "$DMG"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaTV-${{ steps.meta.outputs.version }}-arm64-dmg
          path: ${{ steps.dmg.outputs.dmg }}
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: steps.meta.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MetaTV ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: ${{ steps.dmg.outputs.dmg }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
