name: Windows rolling

# Every push to main: build MetaTV for Windows (PyInstaller one-folder build plus
# a portable mpv) and attach MetaTV-windows-x64.zip to the `rolling` release
# beside the macOS .dmg and the Flatpak. Separate from release.yml for the same
# reason flatpak-rolling.yml is: a Windows failure must never hold back the
# other builds. workflow_dispatch builds any ref as a workflow artifact only.
#
# No test step: the suite has never run on Windows, and CI's two test platforms
# (ci.yml) already gate main. This job only packages.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Newest push wins — two main pushes racing to upload would otherwise let the
# slower (possibly older) build overwrite the newer one.
concurrency:
  group: windows-rolling-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # upload the asset to the rolling release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # Pillow lets PyInstaller turn the committed PNG into the .exe icon.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Stamp the build id
        # Same identifier release.yml stamps: <version>+<UTC date>.<short sha>,
        # so a Windows build's title bar names its commit like the .dmg does.
        run: |
          set -euo pipefail
          VERSION="$(python -c "import metatv; print(metatv.__version__)")"
          STAMP="${VERSION}+$(date -u +%Y%m%d).$(git rev-parse --short HEAD)"
          printf 'BUILD_ID = "%s"\n' "$STAMP" > metatv/_build_id.py
          echo "Stamped build id: $STAMP"

      - name: Build MetaTV (PyInstaller)
        run: pyinstaller packaging/metatv.spec --noconfirm

      - name: Vendor mpv into the build
        # mpv's own site points Windows users at shinchiro's builds. The plain
        # x86_64 archive (not -v3, which needs AVX2, and not -dev) is a
        # self-contained mpv.exe with its DLLs — no install step.
        # _resolve_mpv_binary() finds it at <exe dir>/mpv/mpv.exe.
        run: |
          set -euo pipefail
          REPO=shinchiro/mpv-winbuild-cmake
          ASSET="$(gh release view --repo "$REPO" --json assets --jq \
            '.assets[].name | select(test("^mpv-x86_64-[0-9]{8}-git-[0-9a-f]+\\.7z$"))' | head -1)"
          if [ -z "$ASSET" ]; then
            echo "::error::No plain x86_64 mpv archive in the latest $REPO release"
            exit 1
          fi
          echo "Using $ASSET"
          gh release download --repo "$REPO" --pattern "$ASSET" --dir mpv-download
          7z x "mpv-download/$ASSET" -o"dist/MetaTV/mpv" -y
          test -f dist/MetaTV/mpv/mpv.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Zip the build
        run: |
          set -euo pipefail
          cd dist
          7z a ../MetaTV-windows-x64.zip MetaTV
          ls -la ../MetaTV-windows-x64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaTV-windows-x64
          path: MetaTV-windows-x64.zip
          if-no-files-found: error

      - name: Upload to the rolling release
        # The release itself (tag, title, notes) is created and moved by
        # release.yml; this job only adds or replaces its own asset under a
        # stable, version-free name.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            gh release view rolling --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            echo "rolling release not there yet — waiting for release.yml"; sleep 20
          done
          gh release upload rolling MetaTV-windows-x64.zip --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
