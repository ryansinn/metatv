# Test every pull request, on both platforms, BEFORE it can reach main.
#
# This did not exist until 2026-08-27, and its absence is the single most
# expensive gap the external audit found. The only workflow was the macOS
# release build, triggered on push to main — so the suite ran AFTER merge, as
# step one of the build that ships to the tester.
#
# What that cost, measured on one week:
#   - 58 test failures accumulated across five merges before anything noticed.
#     Every one came from a cross-cutting change breaking files the PR never
#     touched, which the local --quick gate cannot see by construction: it runs
#     only a PR's OWN changed test files.
#   - The macOS release build failed on every push for three weeks. Eight of
#     its nine failures pre-dated the week entirely. Nobody was looking, because
#     looking meant opening the Actions tab rather than being told.
#
# BOTH platforms run, and that is deliberate rather than thorough-for-its-own-
# sake. Linux is where the app is developed; macOS is where it ships, and the
# nine failures that hid for three weeks were macOS-only — a menu bar that is a
# system bar rather than a window widget, and a font rasterizer that paints the
# same token 16px where Linux paints 18. A Linux-only gate would have caught
# none of them.
name: CI

# EVERY pull request, whatever it targets. There is deliberately no
# `branches:` filter here, and that is a fix rather than an oversight.
#
# `pull_request.branches` filters on the BASE branch, so `branches: [main]`
# meant a PR stacked on another PR got no gate at all — not a slow run, not a
# pending check: zero checks, silently, by configuration. #654 sat "green" in
# the sense that nothing had ever disagreed with it.
#
# That is the same shape as the gap this whole workflow was created to close.
# The pre-2026-08-27 hole was "the suite runs after merge"; this one was "the
# suite runs unless you stack", and both are invisible in exactly the way that
# lets work accumulate behind them. A gate with a quiet exemption is worse than
# a missing gate, because the missing one is at least known to be missing.
#
# Cost of removing the filter: one extra full run per stacked PR, testing that
# PR merged into its own base. That is the run you actually want — it is the
# tree that lands. `concurrency` below keys on `github.ref`, which is
# `refs/pull/<n>/merge`, so each PR still cancels only its own earlier runs.
on:
  pull_request:
  workflow_dispatch:

# A new push to the same PR makes the previous run irrelevant. Cancelling keeps
# the queue short so the gate stays fast enough that nobody wants it skipped.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconds, and it runs first because a NameError does not need fifteen
  # minutes of Qt to be worth reporting. The rule set lives in pyproject.toml,
  # including a stage-B backlog of codes that are selected but ignored — clear
  # a batch, delete its ignore line, and this job starts enforcing it.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.6.0"

      - name: Run ruff
        run: ruff check .

  # Two to three minutes, and it exists because the full matrix takes
  # seventeen. Every failure this repo has shipped to a PR so far would have
  # been reported here instead: a ratchet breach, an import error, a launch
  # crash. Waiting a quarter of an hour to be told a file is seven lines too
  # long is the thing this removes.
  #
  # It does NOT replace the matrix — it is strictly a fast subset, and the
  # matrix still decides. Nothing here is platform-specific, so it runs on
  # Linux only.
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Imports EVERY test module without running anything — which is the
      # cheapest possible check that the tree is coherent, and it is DERIVED
      # rather than a list someone maintains. It is also where the local-3.14
      # vs CI-3.12 annotation class shows up: PEP 649 evaluates annotations
      # lazily on 3.14, so a function annotated with a name its module never
      # imports passes locally and fails at import here. Seconds, 525 files.
      - name: Collect every test (import check)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ --collect-only -q

      # The structural guards, which are near-instant and catch what actually
      # breaks: a file grown past its pinned size, the app failing to boot, and
      # tests writing the real user config (a real data-loss bug once).
      - name: Structural guards
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q \
            tests/test_code_health_ratchet.py \
            tests/test_mainwindow_launch_smoke.py \
            tests/test_config_isolation.py

  test:
    name: tests (${{ matrix.os }}, ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both. Cancelling the sibling on first failure hides whether a
      # failure is platform-specific, which is the single most useful thing
      # this matrix tells you.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        # Four shards each. The suite is ~8,000 tests and seventeen minutes
        # single-file; split four ways it is about five, which is the
        # difference between waiting for the gate and working through it.
        #
        # Sharded by FILE, not by test, so ordering within a file is preserved
        # and conftest fixtures behave exactly as they do locally. The split is
        # a greedy longest-first bin-pack over file size (scripts/ci_shard.py)
        # — deterministic, so every runner computes the same assignment without
        # coordinating, and balanced, which round-robin is not: these files are
        # wildly uneven and a job is only as fast as its slowest shard.
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.12, matching the release build — NOT the 3.14 used locally.
          # PEP 649 makes 3.14 evaluate annotations lazily, so a function
          # annotated with a name its module never imports passes locally and
          # fails at import time here. This job is where that class is caught.
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite (shard ${{ matrix.shard }} of 4)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/ci_shard.py --shard ${{ matrix.shard }} --of 4 > shard.txt
          echo "$(wc -l < shard.txt) test files in this shard"
          # Command substitution, deliberately, on two counts.
          #
          # NOT `xargs -a`: -a is a GNU extension and BSD xargs on macos-14 has
          # no such flag, so all four macOS shards died in 17 seconds with a
          # usage message. (The matrix exists for exactly this — a Linux-only
          # gate would have called this green.)
          #
          # NOT `xargs < shard.txt` either: xargs reports 123 for "some
          # invocation failed" rather than passing pytest's own status through,
          # and this command's exit code IS the gate. Test paths never contain
          # spaces and 131 of them is ~5 KB, far under ARG_MAX, so plain word
          # splitting is safe here and keeps the status exact.
          python -m pytest -q $(cat shard.txt)
