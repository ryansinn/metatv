name: Flatpak rolling (Linux)

# Every push to main: build MetaTV.flatpak (flatpak-build.yml) and attach it to
# the `rolling` release beside the macOS .dmg. Separate from release.yml on
# purpose — a Flatpak failure must never hold back the .dmg, and vice versa.
on:
  push:
    branches:
      - main

# Newest push wins, as in release.yml — two main pushes racing to upload would
# otherwise let the slower (possibly older) build overwrite the newer one.
concurrency:
  group: flatpak-rolling-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # upload the asset to the rolling release

jobs:
  build:
    uses: ./.github/workflows/flatpak-build.yml

  publish:
    # Attach to `rolling` only from main. The release itself (tag, title,
    # notes) is created and moved by release.yml; this job only adds or
    # replaces its own asset under a stable, version-free name.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MetaTV-flatpak

      - name: Upload MetaTV.flatpak to the rolling release
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            gh release view rolling --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            echo "rolling release not there yet — waiting for release.yml"; sleep 20
          done
          gh release upload rolling MetaTV.flatpak --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
